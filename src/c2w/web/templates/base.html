<!doctype html>
{# data-volume carries the account's playback preference to player.js, which
   applies it to every <audio> on the page. It sat unused in the database until
   that module existed. #}
<html lang="en" data-volume="{{ prefs.volume | default(100) }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>{% block title %}c2w{% endblock %}</title>
  {# Applied before the stylesheet so a dark-mode viewer never sees a white
     flash on navigation. Wrapped because storage access throws outright in
     some contexts (private windows, blocked site data). #}
  <script>
    // Applied before the stylesheet so a dark-mode viewer never sees a white
    // flash. The value comes from the account below; this is only the cached
    // copy that avoids the flash. Wrapped because storage access throws
    // outright in some contexts.
    try {
      var t = localStorage.getItem("c2w-theme");
      if (t) document.documentElement.dataset.theme = t;
    } catch (e) {}
  </script>
  <style>
    /* Text size and typeface, as chosen on the account page. Every size in the
       kit is relative to the root, so one number scales the whole console --
       tables, pills and captions included.

       Pixels rather than a percentage: "18px" is a size somebody can reason
       about, where "110%" is a size relative to a browser default they cannot
       see. The default is 20px, four more than the browser's usual 16.

       Every family below is one already installed on the machine. This console
       runs on a private network with no outbound access, so a web font would
       render as a silent fallback. */
    :root {
      font-size: {{ (prefs.font_px | default(20)) }}px;
      {# `safe` because this is a CSS declaration, not text: autoescaping turns
         the quotes in "Segoe UI" into &#34; and the whole font-family becomes
         invalid, so the choice silently does nothing. The value is a constant
         from FONT_STACKS -- the preference only ever selects a key, and an
         unknown key falls back -- so nothing from the user reaches here. #}
      --sans: {{ font_stack | safe }};
    }
  </style>
  {# The kit, then the handful of rules it leaves to the application. kit.css
     is @imports in dependency order: tokens define what everything else
     resolves to, and narrow.css is all overrides so it goes last. #}
  <link rel="stylesheet" href="/static/ui-kit/kit.css?v={{ asset_v | default(0) }}">
  <link rel="stylesheet" href="/static/app.css?v={{ asset_v | default(0) }}">
  <script src="/static/vendor/htmx.min.js?v={{ asset_v | default(0) }}" defer></script>
  <script src="/static/vendor/alpine.min.js?v={{ asset_v | default(0) }}" defer></script>
  <script src="/static/player.js?v={{ asset_v | default(0) }}" defer></script>
</head>
<body>
{# Where flash messages end up. They are still rendered inline by each page,
   and moved here by the script at the bottom -- so with JavaScript off they
   appear in the page as before rather than vanishing. #}
<div id="toasts" class="toasts" role="status" aria-live="polite"></div>

<header class="top">
  <div class="brand">
    {{ platform_name }}
    <span>call recording archive</span>
  </div>

  {# The underline means "you are here" at every level, so the same idiom is
     used again in .subnav one level down. #}
  <nav class="top">
    <a href="/" class="{{ 'on' if nav == 'dashboard' }}">Dashboard</a>
    <a href="/calls" class="{{ 'on' if nav == 'calls' }}">Calls</a>
    {# Only where text messaging is switched on: an empty page for a menu item
       that will never have data is worse than no menu item. #}
    {% if sms_enabled %}
      <a href="/messages" class="{{ 'on' if nav == 'messages' }}">Messages</a>
    {% endif %}
    <a href="/sync" class="{{ 'on' if nav == 'sync' }}">Sync</a>
    {% if 'storage.view' in permissions %}
      <a href="/admin/connections" class="{{ 'on' if nav == 'connections' }}">CommPeak</a>
      <a href="/admin/storage" class="{{ 'on' if nav == 'storage' }}">Archive</a>
    {% endif %}
    {# Organisations and Users are sections of the settings rail, not menu
       entries of their own: both are configuration, and the top menu is for
       the things an operator does daily. #}
    {% if 'settings.view' in permissions %}
      <a href="/admin/settings" class="{{ 'on' if nav == 'settings' }}">Settings</a>
    {% endif %}
    {% if 'audit.view' in permissions %}
      <a href="/audit" class="{{ 'on' if nav == 'audit' }}">Audit</a>
    {% endif %}
  </nav>

  {# The organisation's own time, not the server's. On a console watching jobs
     that run to a schedule, "is it 02:00 there yet" is a question worth being
     able to answer without arithmetic. #}
  <div class="clock" title="{{ org_timezone }}">
    <span id="clock-time" class="mono">--:--:--</span>
    <span class="clock-zone">{{ org_timezone | zone_label }}</span>
  </div>

  {# Google-style: one button showing who you are, everything about you behind
     it. The organisation switcher lives here too rather than in the header --
     most people have one organisation and would never touch a dropdown that
     was permanently in their way. #}
  <details class="account" id="account-menu">
    <summary title="{{ user.email }}">
      <span class="avatar">{{ user | initials }}</span>
    </summary>
    <div class="account-panel">
      <div class="account-head">
        <span class="avatar big">{{ user | initials }}</span>
        <div>
          <strong>{{ user.display_name or user.email }}</strong>
          <div class="det">{{ user.email }}</div>
          <span class="pill idle">{{ role_here.label }}</span>
        </div>
      </div>

      {% if brands | length > 1 %}
        <div class="account-section">
          <span class="hint">Organisation</span>
          {% for b in brands %}
            <form method="post" action="/switch-brand">
              <input type="hidden" name="brand_id" value="{{ b.id }}">
              <button type="submit" class="account-item {{ 'on' if active_brand and b.id == active_brand.id }}">
                <span>{{ b.name }}</span>
                {% if active_brand and b.id == active_brand.id %}<span class="tick">&check;</span>{% endif %}
              </button>
            </form>
          {% endfor %}
        </div>
      {% elif active_brand %}
        <div class="account-section">
          <span class="hint">Organisation</span>
          <div class="account-item static">{{ active_brand.name }}</div>
        </div>
      {% endif %}

      <div class="account-section">
        <a class="account-item" href="/me">Appearance and account</a>
        {% if user.auth_source == 'LOCAL' %}
          <a class="account-item" href="/me#password">Change password</a>
          <a class="account-item" href="/me#twofactor">Two-factor</a>
        {% else %}
          <div class="account-item static det">
            Signed in with {{ user.auth_source | lower }} &mdash; your password and
            two-factor are managed there
          </div>
        {% endif %}
      </div>

      <div class="account-section">
        <a class="account-item signout" href="/logout">Sign out</a>
      </div>
    </div>
  </details>
</header>

<main class="{% block frame %}{% endblock %}">
  {% block body %}{% endblock %}
</main>

<script>
  // Keep the cached theme in step with what the account says, so the pre-paint
  // script above cannot show the wrong one after a change on another machine.
  try { localStorage.setItem("c2w-theme", {{ (prefs.theme | default('auto')) | tojson }}); }
  catch (e) {}
  (function () {
    var t = {{ (prefs.theme | default('auto')) | tojson }};
    if (t === "auto") delete document.documentElement.dataset.theme;
    else document.documentElement.dataset.theme = t;
  })();

  // The organisation's clock. Ticking in the browser rather than rendered by
  // the server, because a time that is wrong the moment the page loads is
  // worse than no clock at all.
  (function () {
    var el = document.getElementById("clock-time");
    if (!el) return;
    var fmt;
    try {
      fmt = new Intl.DateTimeFormat([], {
        timeZone: {{ org_timezone | tojson }},
        hour: "2-digit", minute: "2-digit", second: "2-digit", hour12: false,
      });
    } catch (e) {
      // An unknown zone name must not take the page down with it.
      fmt = new Intl.DateTimeFormat([], {
        hour: "2-digit", minute: "2-digit", second: "2-digit", hour12: false,
      });
    }
    function tick() { el.textContent = fmt.format(new Date()); }
    tick();
    setInterval(tick, 1000);
  })();

  // Flash messages belong out of the way, not shoved into the top of the page
  // pushing everything down. Each page still renders them inline; they are
  // lifted into the corner here, which means no JavaScript still shows them.
  (function () {
    var tray = document.getElementById("toasts");
    if (!tray) return;
    var found = document.querySelectorAll("main .flash");
    for (var i = 0; i < found.length; i++) {
      var note = found[i];
      note.classList.add("toast");

      var close = document.createElement("button");
      close.type = "button";
      close.className = "toast-x";
      close.setAttribute("aria-label", "Dismiss");
      close.textContent = "\u00d7";
      close.addEventListener("click", function (e) {
        var box = e.target.parentNode;
        box.classList.add("going");
        setTimeout(function () { box.remove(); }, 200);
      });
      note.appendChild(close);
      tray.appendChild(note);

      // Successes announce themselves and go. Failures stay until dismissed:
      // "already has an account" is something you have to read and act on,
      // and a message that disappears while you are still looking at the form
      // is worse than no message.
      if (note.classList.contains("ok")) {
        (function (box) {
          setTimeout(function () {
            box.classList.add("going");
            setTimeout(function () { box.remove(); }, 200);
          }, 6000);
        })(note);
      }
    }
  })();

  // A menu that stays open once you have clicked past it is a menu in the way.
  document.addEventListener("click", function (e) {
    var menu = document.getElementById("account-menu");
    if (menu && menu.open && !menu.contains(e.target)) menu.open = false;
  });
  document.addEventListener("keydown", function (e) {
    if (e.key !== "Escape") return;
    var menu = document.getElementById("account-menu");
    if (menu) menu.open = false;
  });
</script>
</body>
</html>

# nginx front end for c2w.
#
# Two jobs: terminate TLS, and keep recording bandwidth off the application
# process.  Playback normally redirects the browser to a short-lived Wasabi
# presigned URL, so the audio bytes never traverse this server at all.  The
# /internal-media/ location exists only for the proxy fallback, used where
# presigned URLs are unacceptable.

upstream c2w_api {
    server 127.0.0.1:8000;
    keepalive 32;
}

# Login is the one endpoint worth rate limiting hard; media playback is
# authenticated and legitimately bursty.
limit_req_zone $binary_remote_addr zone=c2w_login:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=c2w_api:10m rate=30r/s;

server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name recordings.example.com;   # set to the real hostname

    ssl_certificate     /etc/ssl/certs/c2w.crt;
    ssl_certificate_key /etc/ssl/private/c2w.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # CSV/XLSX exports of a large CDR range can be big; the audio itself is not
    # uploaded through here.
    client_max_body_size 32m;

    access_log /var/log/nginx/c2w.access.log;
    error_log  /var/log/nginx/c2w.error.log warn;

    location /static/ {
        alias /opt/c2w/src/c2w/web/static/;
        expires 30d;
        access_log off;
    }

    location = /auth/login {
        limit_req zone=c2w_login burst=3 nodelay;
        proxy_pass http://c2w_api;
        include /etc/nginx/c2w_proxy_params.conf;
    }

    location /api/ {
        limit_req zone=c2w_api burst=60 nodelay;
        proxy_pass http://c2w_api;
        include /etc/nginx/c2w_proxy_params.conf;
    }

    # Proxy-mode playback: the API authorises the request, then hands back an
    # X-Accel-Redirect so nginx streams from the destination. Keeps credentials
    # and Range handling out of Python.
    location /internal-media/ {
        internal;
        resolver 1.1.1.1 8.8.8.8 valid=300s;
        set $upstream_media "$upstream_http_x_media_url";
        proxy_pass $upstream_media;
        proxy_set_header Authorization "";
        proxy_set_header Host $proxy_host;
        proxy_buffering off;
        proxy_http_version 1.1;
    }

    location / {
        proxy_pass http://c2w_api;
        include /etc/nginx/c2w_proxy_params.conf;
    }
}
